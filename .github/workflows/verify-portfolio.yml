name: Verify portfolio interface
on:
  push:
    branches: [portfolio-home]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify product mappings and existing logic
        run: |
          python3 -m unittest discover -s tests -v
          node tests/ui.cjs
          node tests/home.cjs
      - name: Install Korean fonts for visual verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop and mobile experience
        run: |
          npm install --prefix /tmp/dashboard-browser-check --no-save --package-lock=false playwright@1.58.2
          python3 -m http.server 8765 --directory dist >/tmp/dashboard-http.log 2>&1 &
          node tests/browser.cjs
      - name: Preserve interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-interface
          path: /tmp/dashboard-shots/
