name: Verify CMS ASP integration
on:
  push:
    branches: [cms-asp-integration]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Regression checks
        run: |
          python3 -m unittest discover -s tests -q
          node tests/ui.cjs
          node tests/home.cjs
          node tests/price.cjs
      - name: Collect current CMS files
        run: |
          pip install requests pandas openpyxl xlrd
          python3 scripts/asp.py
          node tests/price.cjs
      - name: Browser setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/dashboard-browser-check --no-save --package-lock=false playwright@1.58.2
      - name: Browser validation
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/dashboard-http.log 2>&1 &
          node tests/price-browser.cjs
      - name: Save verified CMS snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/asp.json
          git diff --cached --quiet || git commit -m "Save verified CMS snapshot for price integration"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cms-integration-screenshots
          path: /tmp/dashboard-shots/
