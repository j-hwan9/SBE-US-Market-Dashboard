name: Refresh official sources
on:
  workflow_dispatch:
    inputs:
      force_download:
        description: Re-download unchanged PI files too
        type: boolean
        default: false
  schedule:
    - cron: '23 0 8 * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Verify collection and comparison logic
        run: |
          python3 -m unittest discover -s tests -v
          node tests/ui.cjs
      - name: Fetch official sources and validate
        env:
          FORCE_DOWNLOAD: ${{ inputs.force_download }}
        run: |
          if [ "$FORCE_DOWNLOAD" = "true" ]; then
            python3 scripts/refresh.py --force
          else
            python3 scripts/refresh.py
          fi
      - name: Save successful snapshot and monthly history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/history data/sources data/approval-letter-cache.json reports/latest-refresh.json reports/approval-letters.json
          git diff --cached --quiet || git commit -m "Update official Purple Book and PI snapshot"
          git push
      - name: Configure public deployment
        run: python3 scripts/prepare_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Keep refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics
          path: reports
          if-no-files-found: ignore
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
