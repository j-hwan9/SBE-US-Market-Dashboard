name: Daily regulatory and ASP refresh
on:
  workflow_dispatch:
    inputs:
      force_download:
        description: Re-download unchanged PI files too
        type: boolean
        default: false
  schedule:
    - cron: '0 21 * * *' # Daily 06:00 KST
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-dashboard
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests pandas openpyxl xlrd
      - name: Verify collection and comparison logic
        run: |
          python3 -m unittest discover -s tests -v
          node tests/ui.cjs
      - name: Fetch official sources and validate
        id: regulatory
        continue-on-error: true
        env:
          FORCE_DOWNLOAD: ${{ inputs.force_download }}
        run: |
          if [ "$FORCE_DOWNLOAD" = "true" ]; then
            python3 scripts/refresh.py --force
          else
            python3 scripts/refresh.py
          fi
      - name: Sync approved-brand ASP catalog
        if: steps.regulatory.outcome == 'success'
        run: python3 scripts/asp.py --catalog-only
      - name: Fetch CMS ASP and archive material changes
        id: asp
        continue-on-error: true
        run: |
          python3 scripts/asp.py
          node tests/price.cjs
      - name: Report collection outcomes
        env:
          REGULATORY_OUTCOME: ${{ steps.regulatory.outcome }}
          ASP_OUTCOME: ${{ steps.asp.outcome }}
        run: |
          echo "Regulatory: $REGULATORY_OUTCOME; ASP: $ASP_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REGULATORY_OUTCOME" != "success" ]; then echo "::warning::Regulatory collection failed; previous published regulatory data retained."; fi
          if [ "$ASP_OUTCOME" != "success" ]; then echo "::warning::ASP collection failed; inspect diagnostics and retained observations."; fi
          if [ "$REGULATORY_OUTCOME" != "success" ] && [ "$ASP_OUTCOME" != "success" ]; then exit 1; fi
      - name: Save successful checks and change-only history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/asp.json dist/history
          if [ -d dist/asp-history ]; then git add dist/asp-history; fi
          git add data/sources data/approval-letter-cache.json reports/latest-refresh.json reports/approval-letters.json
          for report in reports/latest-asp-refresh.json reports/asp-matching.json; do if [ -f "$report" ]; then git add "$report"; fi; done
          git diff --cached --quiet || git commit -m "Check regulatory and ASP sources; archive material changes"
          git push
      - name: Configure public deployment
        run: python3 scripts/prepare_public.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Keep refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-diagnostics
          path: reports
          if-no-files-found: ignore
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
