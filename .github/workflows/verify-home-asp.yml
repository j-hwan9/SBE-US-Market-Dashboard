name: Verify Home ASP
on:
  push:
    branches: [home-asp-link]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Regression checks
        run: |
          python3 -m unittest discover -s tests -q
          node tests/ui.cjs
          node tests/home.cjs
          node tests/price.cjs
      - name: Browser setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/dashboard-browser-check --no-save --package-lock=false playwright@1.58.2
      - name: Browser verification
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/dashboard-http.log 2>&1 &
          node tests/home-asp-browser.cjs
